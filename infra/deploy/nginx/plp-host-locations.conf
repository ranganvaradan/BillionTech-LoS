# Additive nginx locations for PLP (Credinnov EC2).
# Do not remove or edit existing locations (/credinnov-encore-server/, /los/, /, etc.).
#
# Install:
#   sudo cp deploy/nginx/plp-host-locations.conf /etc/nginx/snippets/plp-host-locations.conf
#
# Inside the same server { } block, add:
#   include snippets/plp-host-locations.conf;
#
# Before using /plp-api/, set PLP UI env-config.js to VITE_API_BASE_URL: '/plp-api'
# and restart platform-ui, anchor-portal, borrower-portal.

location /plp/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /plp-anchor/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Borrower portal also uses /plp/ inside its container — expose under /plp-borrower/
location /plp-borrower/ {
    rewrite ^/plp-borrower/(.*)$ /plp/$1 break;
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /plp-api/ {
    proxy_pass http://127.0.0.1:8180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
