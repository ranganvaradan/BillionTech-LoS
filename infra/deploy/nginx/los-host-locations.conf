# Additive nginx locations for LOS under /los/ (Credinnov EC2).
# Do not remove or edit existing locations (/credinnov-encore-server/, /, etc.).
#
# Install:
#   sudo cp deploy/nginx/los-host-locations.conf /etc/nginx/snippets/los-host-locations.conf
#
# Inside the existing server { } block for credinnov-sandbox.senseitech.com, add ONE line:
#   include snippets/los-host-locations.conf;
#
# Then:
#   sudo nginx -t && sudo systemctl reload nginx

location = /los {
    return 301 /los/;
}

location /los/ {
    proxy_pass http://127.0.0.1:8080/los/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
