# Profile: staging — isolated CEO / Credit Head review environment.
# NEVER point at production DB. allow-canonical-authority MUST stay false.
# Run: mvn -DskipTests spring-boot:run -Dspring-boot.run.profiles=staging
spring:
  config:
    activate:
      on-profile: staging
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:los_core_staging}
    username: ${POSTGRES_USER:los_admin}
    password: ${POSTGRES_PASSWORD:los_secret_2026}
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

los:
  security:
    local-dev-permit-all: true  # staging review only — isolated staging; never production
    # Still require admin role for /api/v1/admin/** even when other APIs are open
    admin-api-require-role: true
  underwriting:
    # Staging retains gap defaults for existing demos; production must keep false
    provider-gap-defaults-enabled: true
  demo:
    enabled: true
  plp:
    # Default off for safety; enable staging integration via LOS_PLP_ENABLED=true
    enabled: ${LOS_PLP_ENABLED:false}
    base-url: ${PLP_BASE_URL:http://plp-gateway:8080}
    lender-id: ${PLP_LENDER_ID:}
    integration-email: ${PLP_INTEGRATION_EMAIL:}
    integration-password: ${PLP_INTEGRATION_PASSWORD:}
  document:
    storage: local
  file-storage:
    # Staging container bind-mounts uploads at /app/uploads (must be writable by app uid).
    root: ${LOS_FILE_STORAGE_ROOT:/app/uploads}
  # Disable external payment/sanction side effects where properties exist
  integration:
    ai-los:
      # do not call production AI-LOS; leave blank or stub
      ingest-url: ""

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

credit-intelligence:
  staging-demo:
    enabled: true
  shadow-evaluation:
    enabled: true
    kyc-shadow-enabled: true
  foundation:
    enabled: true
  validation:
    enabled: true
    persist-runs: false
  policy-studio:
    enabled: true
    ai-enabled: false
    require-maker-checker: true
  policy-engine:
    enabled: true
    dsl-shadow-enabled: true
  decision-engine:
    enabled: true
    shadow-enabled: true
  ai-underwriter:
    enabled: true
    cam-draft-enabled: true
    scenario-enabled: true
    provider: stub
  cutover:
    enabled: true
    dual-run-enabled: true
    quarantine-enabled: true
    allow-canonical-authority: false
    min-real-or-stored-cases: 20
  # canonicalization families can stay false — staging demo uses validation harness stubs
  internal-token: ${CREDIT_INTELLIGENCE_INTERNAL_TOKEN:}
