los:
  security:
    local-dev-permit-all: false
    admin-api-require-role: true
    enforce-production-hardening: true
  underwriting:
    provider-gap-defaults-enabled: false
    scorecard:
      block-non-authoritative-defaults: true
      allow-non-production-demo-scoring: false
  demo:
    enabled: false
  document:
    storage: local
  file-storage:
    root: /data/documents

credit-intelligence:
  staging-demo:
    enabled: false
  validation:
    enabled: false
  internal-token-required: true
  # Token value MUST come from env CREDIT_INTELLIGENCE_INTERNAL_TOKEN (never commit secrets)
  internal-token: ${CREDIT_INTELLIGENCE_INTERNAL_TOKEN:}
  cutover:
    enabled: false
    dual-run-enabled: false
    quarantine-enabled: false
    allow-canonical-authority: false
  gacat:
    require-database: true
    allow-seed-fallback: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost

spring:
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
    inetutils:
      timeout-seconds: 2
      preferred-networks:
        - 172
        - 10