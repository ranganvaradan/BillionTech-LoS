los:
  security:
    local-dev-permit-all: false
    admin-api-require-role: true
  underwriting:
    provider-gap-defaults-enabled: false
  demo:
    enabled: false
  document:
    storage: local
  file-storage:
    root: /data/documents

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost

spring:
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
    inetutils:
      timeout-seconds: 2
      preferred-networks:
        - 172
        - 10