version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: los-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: los-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: los-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: los-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  discovery-service:
    build:
      context: .
      dockerfile: services/discovery-service/Dockerfile
    container_name: los-discovery
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: los-gateway
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - EUREKA_HOST=discovery-service
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    container_name: los-iam
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  los-core-service:
    build:
      context: .
      dockerfile: services/los-core-service/Dockerfile
    container_name: los-core
    restart: always
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - KARZA_API_KEY=${KARZA_API_KEY}
      - EQUIFAX_CUSTOMER_ID=${EQUIFAX_CUSTOMER_ID}
      - EQUIFAX_USERNAME=${EQUIFAX_USERNAME}
      - EQUIFAX_PASSWORD=${EQUIFAX_PASSWORD}
      - EMSIGNER_AUTH_TOKEN=${EMSIGNER_AUTH_TOKEN}
      - EMSIGNER_BASE_URL=${EMSIGNER_BASE_URL}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: los-enrollment
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: los-notification
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx192m
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  lms-adapter-service:
    build:
      context: .
      dockerfile: services/lms-adapter-service/Dockerfile
    container_name: los-lms
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx192m
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - LMS_BASE_URL=${LMS_BASE_URL}
      - LMS_API_KEY=${LMS_API_KEY}
    depends_on:
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: los-frontend
    restart: always
    environment:
      - API_BACKEND_URL=http://api-gateway:8080
      - NODE_ENV=production
    depends_on:
      - api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.los-frontend.rule=Host(`los.billiontech.ai`)"
      - "traefik.http.routers.los-frontend.entrypoints=https"
      - "traefik.http.routers.los-frontend.tls=true"
      - "traefik.http.routers.los-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.los-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
