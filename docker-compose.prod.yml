version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: los-postgres
    restart: always
    environment:
      POSTGRES_DB: losdb
      POSTGRES_USER: losuser
      POSTGRES_PASSWORD: Bltest@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U losuser -d losdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: los-redis
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: los-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: losuser
      RABBITMQ_DEFAULT_PASS: lospassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  los-core:
    build:
      context: .
      dockerfile: services/los-core-service/Dockerfile.prod
    container_name: los-core
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      POSTGRES_DB: losdb
      POSTGRES_USER: losuser
      POSTGRES_PASSWORD: Bltest@123
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/losdb
      SPRING_DATASOURCE_USERNAME: losuser
      SPRING_DATASOURCE_PASSWORD: Bltest@123
      DOCUMENT_STORAGE_PATH: /data/documents
      LOS_FILE_STORAGE_ROOT: /data/documents
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: losuser
      SPRING_RABBITMQ_PASSWORD: lospassword
      JWT_SECRET: BillionTechLOSJwtSecretKey2026MustBeAtLeast32Chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - los_documents:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: los-notification
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/losdb
      SPRING_DATASOURCE_USERNAME: losuser
      SPRING_DATASOURCE_PASSWORD: Bltest@123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: losuser
      SPRING_RABBITMQ_PASSWORD: lospassword
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: billiontechuat@gmail.com
      SMTP_PASSWORD: lqwt apmk jusw hcyo
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: billiontechuat@gmail.com
      SPRING_MAIL_PASSWORD: lqwt apmk jusw hcyo
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      EMAIL_FROM_ADDRESS: billiontechuat@gmail.com
      EMAIL_FROM_NAME: LOS Platform
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./ui-service
      dockerfile: Dockerfile.prod
    container_name: los-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      los-core:
        condition: service_started
        
volumes:
  postgres_data:
  rabbitmq_data:
  los_documents:
