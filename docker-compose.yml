version: "3.9"

services:
  # ─── Service Discovery ──────────────────────────────────
  discovery-service:
    build:
      context: .
      dockerfile: services/discovery-service/Dockerfile
    container_name: los_discovery
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: los_postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - los_postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"   # keep for local access (psql, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: los_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"   # keep for debugging if needed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: los_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: losuser
      RABBITMQ_DEFAULT_PASS: lospassword
    ports:
      - "5672:5672"
      - "15672:15672"  # UI
    volumes:
      - los_rabbitmq_data:/var/lib/rabbitmq   # ✅ FIX: avoids cookie permission issue
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Core Service ──────────────────────────────────────
  los-core:
    build:
      context: .
      dockerfile: services/los-core-service/Dockerfile.prod
    container_name: los_core
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      JAVA_OPTS: "-Xms512m -Xmx2g -Djava.net.preferIPv4Stack=true"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"

      # DB (match prod exactly)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Storage (file system like prod)
      DOCUMENT_STORAGE_PATH: /data/documents

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: losuser
      SPRING_RABBITMQ_PASSWORD: lospassword

      LOS_NOTIFICATION_URL: http://notification-service:8084

      ENCORE_BASE_URL: ${ENCORE_BASE_URL:-http://credinnov-sandbox.senseitech.com/credinnov-encore-server/}
      ENCORE_API_USERNAME: ${ENCORE_API_USERNAME:-admin}
      ENCORE_API_PASSWORD: ${ENCORE_API_PASSWORD:-password1}
      ENCORE_REST_AUTH_TOKEN: ${ENCORE_REST_AUTH_TOKEN:-}
      LMS_CALLBACK_HMAC_SECRET: ${LMS_CALLBACK_HMAC_SECRET:-}

      # PayU (same test credentials as PLP lending-service)
      PAYU_MERCHANT_KEY: ${PAYU_MERCHANT_KEY:-g8yc8J}
      PAYU_MERCHANT_SALT: ${PAYU_MERCHANT_SALT:-BBc2U41mOZPLuteAYBW9wJ2Lnm9V9rQV}
      PAYU_GATEWAY_URL: ${PAYU_GATEWAY_URL:-https://test.payu.in/_payment}
      LOS_PUBLIC_API_BASE_URL: ${LOS_PUBLIC_API_BASE_URL:-http://localhost:8083}
      LOS_BORROWER_UI_URL: ${LOS_BORROWER_UI_URL:-http://localhost:5173/los/borrower}

    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started

    volumes:
      - los_documents:/data/documents

    ports:
      - "8083:8083"  # expose for local testing

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Notification Service ───────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: los_notification
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/los_notification
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: losuser
      SPRING_RABBITMQ_PASSWORD: lospassword
      EUREKA_HOST: discovery-service
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-billiontechuat@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-lqwt apmk jusw hcyo}
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-billiontechuat@gmail.com}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-lqwt apmk jusw hcyo}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "10000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "10000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "10000"
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: ${SMTP_DEBUG:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-SMTP}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-billiontechuat@gmail.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-LOS Platform}
      EMAIL_SIMULATION_ENABLED: ${EMAIL_SIMULATION_ENABLED:-false}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── UI Service ────────────────────────────────────────
  ui-service:
    build:
      context: ./ui-service
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_PATH: /los/
        VITE_API_BASE_URL: /los/api/v1
    container_name: los_ui
    restart: unless-stopped
    depends_on:
      los-core:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "${LOS_UI_HOST_PORT:-8080}:80"

# ─── Volumes ─────────────────────────────────────────────
# WARNING: 'docker compose down -v' destroys ALL named volumes below.
# In production, never use -v unless you intend to wipe all databases.
volumes:
  los_postgres_data:
  los_documents:
  los_rabbitmq_data: