version: '3.9'

services:
  # ─── Infrastructure ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: los-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-los_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-los_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-los_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: los-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-los_redis_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-los_redis_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: los-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-los_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-los_rabbit_2026}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: los-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-los_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-los_minio_secret_2026}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set losminio http://minio:9000 ${MINIO_ACCESS_KEY:-los_minio_admin} ${MINIO_SECRET_KEY:-los_minio_secret_2026};
      mc mb --ignore-existing losminio/los-documents;
      mc mb --ignore-existing losminio/los-signed-docs;
      mc mb --ignore-existing losminio/los-reports;
      mc mb --ignore-existing losminio/los-templates;
      echo 'MinIO buckets initialized';
      "

  # ─── Backend Services ──────────────────────────────────
  discovery-service:
    build:
      context: .
      dockerfile: services/discovery-service/Dockerfile
    container_name: los-discovery
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: los-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=discovery-service
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-los_redis_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    container_name: los-iam
    ports:
      - "8081:8081"
    environment:
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-los_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-los_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-los_redis_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: los-enrollment
    ports:
      - "8082:8082"
    environment:
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-los_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-los_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-los_redis_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  los-core-service:
    build:
      context: .
      dockerfile: services/los-core-service/Dockerfile
    container_name: los-core
    ports:
      - "8083:8083"
    environment:
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-los_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-los_secret_2026}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-los_rabbit}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-los_rabbit_2026}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-los_minio_admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-los_minio_secret_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: los-notification
    ports:
      - "8084:8084"
    environment:
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-los_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-los_secret_2026}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-los_rabbit}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-los_rabbit_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  lms-adapter-service:
    build:
      context: .
      dockerfile: services/lms-adapter-service/Dockerfile
    container_name: los-lms
    ports:
      - "8085:8085"
    environment:
      - EUREKA_HOST=discovery-service
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-los_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-los_secret_2026}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: los-frontend
    ports:
      - "3007:3000"
    depends_on:
      - api-gateway

  # ─── Monitoring (Optional — use: docker compose --profile monitoring up) ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: los-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: los-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-change_me_in_production}
    profiles:
      - monitoring

volumes:
  postgres_data:
  minio_data:
