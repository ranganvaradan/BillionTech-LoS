# Slice tests (JPA) — in-memory H2, no Flyway (Postgres-only migrations)
# Same relaxed API rules as local dev so @SpringBootTest continues to work without security setup.
los:
  plp:
    enabled: false
    lender-id: 00000000-0000-0000-0000-000000000001
  document:
    storage: local
  file-storage:
    root: target/los-junit-documents
  security:
    local-dev-permit-all: true

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:losjpa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false
