server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/los_notification
    username: ${POSTGRES_USER:los_admin}
    password: ${POSTGRES_PASSWORD:los_secret_2026}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:los_rabbit}
    password: ${RABBITMQ_PASSWORD:los_rabbit_2026}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:billiontechuat@gmail.com}
    password: ${SMTP_PASSWORD:lqwt apmk jusw hcyo}
    protocol: smtp
    properties:
      mail:
        debug: ${SMTP_DEBUG:false}
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          quitwait: false
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:discovery-service}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.los.notification: DEBUG

# SMS Provider Configuration (MSG91 / Twilio)
los:
  notification:
    sms:
      provider: ${SMS_PROVIDER:MSG91}
      # MSG91 configuration
      msg91:
        auth-key: ${MSG91_AUTH_KEY:}
        sender-id: ${MSG91_SENDER_ID:LOSAPP}
        route: ${MSG91_ROUTE:4}
        base-url: ${MSG91_BASE_URL:https://api.msg91.com/api/v5}
      # Twilio configuration (alternative)
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    email:
      provider: ${EMAIL_PROVIDER:SMTP}
      from-address: ${EMAIL_FROM_ADDRESS:billiontechuat@gmail.com}
      from-name: ${EMAIL_FROM_NAME:LOS Platform}
      simulation-enabled: ${EMAIL_SIMULATION_ENABLED:false}
      # SendGrid configuration
      sendgrid:
        api-key: ${SENDGRID_API_KEY:}
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:META}
      meta:
        phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
        access-token: ${WHATSAPP_ACCESS_TOKEN:}
        base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com/v18.0}
