server:
  port: 8086
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

spring:
  application:
    name: bank-statement-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/los_bankstmt
    username: ${POSTGRES_USER:los_admin}
    password: ${POSTGRES_PASSWORD:los_secret_2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:los_redis_2026}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:los_rabbit}
    password: ${RABBITMQ_PASSWORD:los_rabbit_2026}

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:los_minio_admin}
  secret-key: ${MINIO_SECRET_KEY:los_minio_secret_2026}
  bucket-name: ${MINIO_BUCKET:los-bank-statements}

# API Key Auth
bankstatement:
  security:
    api-key-header: X-API-Key
    api-keys: ${API_KEYS:dev-api-key-2026}
    trust-gateway-headers: ${TRUST_GATEWAY_HEADERS:false}
  analysis:
    salary-keywords: SALARY,SAL,WAGES,PAY,PAYROLL,STIPEND,REMUNERATION
    emi-keywords: EMI,LOAN,EQUATED MONTHLY,REPAYMENT
    rent-keywords: RENT,HOUSE RENT,RENTAL
    insurance-keywords: LIC,INSURANCE,PREMIUM,POLICY
    utility-keywords: ELECTRICITY,WATER,GAS,BROADBAND,MOBILE,RECHARGE,TELECOM,AIRTEL,JIO,VI,BSNL
    investment-keywords: MUTUAL FUND,MF,SIP,FD,FIXED DEPOSIT,RD,RECURRING,SHARE,STOCK,DEMAT,ZERODHA,GROWW
    bounce-keywords: BOUNCE,CHQ RETURN,CHEQUE RETURN,INSTRUMENT RETURN,DISHONOUR,UNPAID,INSUFFICIENT,ECS RETURN,NACH RETURN
    reversal-keywords: REVERSAL,REVERSED,REFUND,CASHBACK
    government-keywords: TAX,GST,TDS,CHALLAN,INCOME TAX,GOVT

# Eureka (conditional — disable for standalone mode)
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.billiontech.bankstatement: DEBUG
    org.springframework.security: INFO
